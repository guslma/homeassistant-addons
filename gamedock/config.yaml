name: GameDock
version: 1.2.1
slug: gamedock
description: Serves your Nintendo Switch game library to the console over your home network,
  with Tinfoil, Sphaira and CyberFoil
url: https://github.com/guslma/GameDock
image: ghcr.io/guslma/gamedock
arch:
- amd64
- aarch64
host_network: true
init: false
environment:
  OWNFOIL_CONFIG_DIR: /config
  OWNFOIL_DATA_DIR: /data
  PUID: '0'
  PGID: '0'
map:
- type: addon_config
  read_only: false
- type: media
  read_only: false
- type: share
  read_only: false
ports:
  8465/tcp: 8465
ports_description:
  8465/tcp: GameDock
webui: http://[HOST]:[PORT:8465]
